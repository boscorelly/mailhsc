# Standalone mode — app + scraper, no Traefik, no HTTPS.
# Launched automatically by start.sh when DEPLOY_MODE=standalone.
# Suitable for: local dev, testing, or deployment behind an existing reverse proxy.

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "1.3.0"
    image: mailhsc-app:latest
    container_name: mailhsc-app
    restart: unless-stopped

    environment:
      PORT: "${PORT:-8080}"

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m

    cap_drop:
      - ALL

    ports:
      - "${STANDALONE_PORT:-8080}:${PORT:-8080}"

    networks:
      - mailhsc_internal
      - mailhsc_external

    depends_on:
      - scraper

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M

    healthcheck:
      test: ["CMD", "/mailhsc", "--health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    image: mailhsc-scraper:latest
    container_name: mailhsc-scraper
    restart: unless-stopped

    environment:
      SCRAPER_PORT: "3000"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - mailhsc_internal   # reachable by app
      - mailhsc_external   # needs internet to reach domainguardian.nebiatek.com

    expose:
      - "3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mailhsc_internal:
    name: mailhsc_standalone_internal
    driver: bridge
    internal: true
  mailhsc_external:
    name: mailhsc_standalone_external
    driver: bridge
